[project]
name = "envbench"
version = "0.1.0"
description = "Multi-source environmental hazard reasoning benchmark for LLMs"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "duckdb>=1.2",
    "geopandas>=1.0",
    "shapely>=2.0",
    "boto3>=1.35",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "scipy>=1.14",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
